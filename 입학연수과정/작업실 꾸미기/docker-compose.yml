version: '3'

services:
  # 기존 nginx
  web:
    image: nginx
    ports:
      - "8080:80"
    volumes:
      - ./html:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:       # api가 먼저 실행된 후 시작
      - api

  # 새로 추가: Python API 서버
  api:
    build: ./api
    environment:        # 추가!
      - PORT=5001       # 추가!
    ports:
      - "5001:5001"     # 5000 → 5001로 변경!
    depends_on:
      - redis

  # 새로 추가: Redis DB
  redis:
    image: redis      # 공식 이미지 그대로 사용